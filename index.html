<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felipe Pick · Links</title>
<meta name="description" content="Formação Poesia Visual, presets e orçamento de ensaio com o Felipe Pick.">
<meta name="theme-color" content="#EBE3D8">
<meta property="og:title" content="Felipe Pick">
<meta property="og:description" content="Qualquer fotógrafo aprende técnica. Poucos desenvolvem identidade.">
<meta property="og:image" content="https://links.felipepick.com/felipe.webp">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Sans:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&family=Big+Shoulders+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(0.92 0.018 78);
    --paper-2: oklch(0.885 0.022 75);
    --ink: oklch(0.18 0.015 55);
    --ink-soft: oklch(0.34 0.018 55);
    --sienna: oklch(0.5 0.12 38);
    --gold: oklch(0.74 0.105 75);
    --rule: oklch(0.74 0.018 65);
    --shadow: 0 6px 24px oklch(0.18 0.015 55 / 0.14);
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--paper); }
  body {
    min-height: 100dvh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 440px;
    padding: 56px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* perfil */
  .perfil { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .foto {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    border: 1px solid var(--rule); box-shadow: var(--shadow);
  }
  .filme { font-size: 15px; letter-spacing: 6px; margin-top: 6px; }
  h1 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 600; font-size: 30px; letter-spacing: -0.02em; line-height: 1;
  }
  .handle {
    font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 400;
    color: var(--ink-soft); text-decoration: none;
  }
  .frase { font-size: 15px; line-height: 1.45; color: var(--ink-soft); max-width: 320px; }

  /* links */
  .links { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 14px;
    color: inherit; text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .link:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .link:active { transform: scale(.985); }
  .emoji {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; font-size: 20px;
    background: var(--paper); border: 1px solid var(--rule);
  }
  .texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .titulo {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 500; font-size: 18px; line-height: 1.15;
  }
  .descricao { font-size: 13.5px; line-height: 1.35; color: var(--ink-soft); }
  .seta { flex: none; font-family: "JetBrains Mono", monospace; font-size: 16px; color: var(--sienna); }

  /* destaque */
  .link.destaque {
    flex-direction: column; align-items: stretch; gap: 14px;
    padding: 22px 20px 20px;
    background: var(--ink); color: var(--paper); border-color: var(--ink);
    box-shadow: var(--shadow);
  }
  .destaque .topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .destaque .eyebrow {
    font-family: "Big Shoulders Display", sans-serif; font-weight: 600;
    font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold);
  }
  .selo {
    font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500;
    padding: 5px 10px; border-radius: 999px;
    background: var(--gold); color: var(--ink);
  }
  .destaque .titulo { font-size: 26px; font-weight: 600; letter-spacing: -0.015em; }
  .destaque .descricao { color: oklch(0.92 0.018 78 / 0.72); font-size: 14.5px; }
  .botao {
    display: block; text-align: center;
    padding: 14px 18px; border-radius: 999px;
    background: var(--sienna); color: var(--paper);
    font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500; letter-spacing: .02em;
  }

  footer {
    text-align: center; font-family: "JetBrains Mono", monospace; font-size: 11px;
    color: var(--ink-soft); opacity: .7; margin-top: 8px;
  }

  @media (prefers-reduced-motion: reduce) { .link { transition: none; } }
</style>
</head>
<body>
<main>
  <header class="perfil" id="perfil"></header>
  <ul class="links" id="links"></ul>
  <footer>📷🎞️📸🎬🖼️</footer>
</main>

<script>
  // Tudo que muda na página vive em links.json. Este arquivo só desenha.
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function desenhar({ perfil, links }) {
    document.getElementById("perfil").innerHTML = `
      <img class="foto" src="${esc(perfil.foto)}" alt="${esc(perfil.nome)}" width="96" height="96">
      <h1>${esc(perfil.nome)}</h1>
      <a class="handle" href="${esc(perfil.instagram)}">${esc(perfil.handle)}</a>
      <p class="frase">${esc(perfil.frase)}</p>`;

    document.getElementById("links").innerHTML = links
      .filter(l => l.ativo !== false)
      .map(l => l.destaque ? `
        <li><a class="link destaque" href="${esc(l.url)}">
          <div class="topo">
            <span class="eyebrow">${esc(l.emoji)} Em destaque</span>
            ${l.selo ? `<span class="selo">${esc(l.selo)}</span>` : ""}
          </div>
          <div class="texto">
            <span class="titulo">${esc(l.titulo)}</span>
            ${l.descricao ? `<span class="descricao">${esc(l.descricao)}</span>` : ""}
          </div>
          <span class="botao">${esc(l.botao || "Quero conhecer")} →</span>
        </a></li>` : `
        <li><a class="link" href="${esc(l.url)}">
          <span class="emoji" aria-hidden="true">${esc(l.emoji)}</span>
          <span class="texto">
            <span class="titulo">${esc(l.titulo)}</span>
            ${l.descricao ? `<span class="descricao">${esc(l.descricao)}</span>` : ""}
          </span>
          ${l.selo ? `<span class="selo">${esc(l.selo)}</span>` : `<span class="seta" aria-hidden="true">→</span>`}
        </a></li>`)
      .join("");
  }

  fetch("links.json", { cache: "no-store" })
    .then(r => r.json())
    .then(desenhar)
    .catch(() => {
      document.getElementById("links").innerHTML =
        `<li><a class="link" href="https://instagram.com/felipe.pick"><span class="texto"><span class="titulo">@felipe.pick</span></span></a></li>`;
    });
</script>
</body>
</html>
